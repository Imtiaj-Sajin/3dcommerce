<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METAMART</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Loading screen -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-logo">META<span>MART</span></div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <div class="loader-hint">opening the doors…</div>
    </div>
  </div>

  <!-- Top header -->
  <header id="hud-top">
    <div class="brand">SOLE<span>SPACE</span></div>
    <div class="hud-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="search" placeholder="Ask for anything — “white classics under $110”" autocomplete="off" />
      <button id="search-camera" title="Search by photo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input id="search-file" type="file" accept="image/*" hidden />
    </div>

    <div class="hud-right">
      <div class="hint-pill" id="controls-hint">⌨ WASD walk · ⇧ run&nbsp;·&nbsp;🖱 drag orbit · wheel zoom&nbsp;·&nbsp;👟 click a sneaker</div>
      <button id="cart-btn" title="Your cart">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="cart-count" class="hidden">0</span>
      </button>
    </div>
  </header>

  <!-- Bottom zone navigation -->
  <nav id="zone-nav">
    <button data-zone="entrance" class="active">⌂</button>
    <button data-zone="nike">Nike</button>
    <button data-zone="jordan">Jordan</button>
    <button data-zone="adidas">adidas</button>
    <button data-zone="newbalance">New Balance</button>
    <button data-zone="asics">ASICS</button>
    <button data-zone="converse">Converse</button>
    <button data-zone="sale" class="sale-btn">SALE %</button>
    <span class="nav-sep"></span>
    <button data-zone="concourse" class="exit-btn">Concourse ⇱</button>
  </nav>

  <!-- AI search results -->
  <aside id="search-panel" class="hidden">
    <div class="sp-head">
      <div>
        <h3 id="sp-title">Results</h3>
        <p class="sp-note" id="sp-note"></p>
      </div>
      <button id="sp-close" title="Close">✕</button>
    </div>
    <div id="sp-results"></div>
  </aside>

  <!-- Product detail modal -->
  <div id="modal" class="hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" title="Close">✕</button>
      <div class="modal-gallery">
        <div class="modal-img-wrap" id="modal-img-wrap">
          <img id="modal-img" alt="Product" draggable="false" />
        </div>
        <div class="modal-thumbs" id="modal-thumbs"></div>
      </div>
      <div class="modal-info">
        <div class="modal-tags">
          <span class="chip" id="modal-category">Running</span>
          <span class="chip chip-tag hidden" id="modal-tag">NEW</span>
        </div>
        <h2 id="modal-name">Sneaker Name</h2>
        <p class="modal-price" id="modal-price">$129</p>
        <p class="modal-desc" id="modal-desc"></p>

        <div class="modal-section">
          <label id="modal-size-label">Size</label>
          <div class="sizes" id="modal-sizes"></div>
        </div>

        <div class="modal-section tryon">
          <label>See it on you</label>
          <div class="tryon-row">
            <select id="tryon-size" title="Your build">
              <option value="XS">XS</option><option value="S">S</option>
              <option value="M" selected>M</option><option value="L">L</option>
              <option value="XL">XL</option><option value="XXL">XXL</option>
            </select>
            <button id="tryon-btn" class="ghost-btn">✨ Generate preview</button>
            <button id="tryon-face" class="ghost-btn" title="Use your own photo (never stored)">＋ Photo</button>
            <input id="tryon-file" type="file" accept="image/*" hidden />
          </div>
          <p class="tryon-note" id="tryon-note"></p>
        </div>

        <button id="add-to-cart">Add to cart</button>
      </div>
    </div>
  </div>

  <!-- Cart drawer -->
  <div id="cart-drawer" class="hidden">
    <div class="cart-head">
      <h3>Your cart</h3>
      <button id="cart-close" title="Close">✕</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total"><span>Total</span><strong id="cart-total">$0</strong></div>
      <button id="checkout-btn">Checkout</button>
    </div>
  </div>

  <!-- Try-on preview -->
  <div id="tryon-modal" class="hidden">
    <div class="modal-backdrop" data-close-tryon></div>
    <div class="tryon-card">
      <button class="modal-close" data-close-tryon>✕</button>
      <h3 id="tryon-title">Preview</h3>
      <div class="tryon-stage">
        <div class="tryon-spinner" id="tryon-spinner">
          <div class="spin"></div>
          <p>Rendering your preview…</p>
          <span>this takes about 15 seconds</span>
        </div>
        <img id="tryon-img" alt="AI try-on preview" hidden />
      </div>
      <p class="tryon-disclaimer" id="tryon-disclaimer"></p>
    </div>
  </div>

  <!-- Doorway prompt + space transition -->
  <div id="enter-prompt" class="hidden">
    <div class="ep-name"></div>
    <div class="ep-hint"></div>
  </div>
  <div id="transition"></div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
